<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Missão Zero Equipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:light;--bg:#F5F4F2;--pn:#FFFFFF;--pn2:#ECEAE5;--ln:#D8D4CC;--ink:#14243A;--mu:#5B6573;--y:#194682;--acc:#AFB91E;--g:#2E8B3E;--r:#C62F2F;--b:#0A91C3;--c:#194682;--disp:"Baloo Chettan 2","Trebuchet MS","Segoe UI",Arial,sans-serif;--body:"Baloo Chettan 2","Segoe UI",Roboto,Arial,sans-serif}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-inline:16px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
.stripe{height:5px;border-radius:99px;background:linear-gradient(90deg,var(--y) 0 72%,var(--acc) 72%)}

.lock{display:block;width:min(260px,70%);height:auto;margin:6px auto 0}
.mod,.opt,.pick button,input{box-shadow:0 1px 2px #14243A12}
.top{display:flex;align-items:center;gap:10px}
.top .tm{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.1}
.top .tm small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--mu)}
.top .sc{margin-left:auto;text-align:right;font-family:var(--disp);font-weight:800;font-size:30px;color:var(--y);font-variant-numeric:tabular-nums;line-height:1}

.badge{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:22px;color:#fff;background:var(--y);flex:none}
h1{font-family:var(--disp);font-weight:800;font-size:40px;line-height:1;margin:6px 0 0;text-wrap:balance;letter-spacing:.01em}
h2{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.mu{color:var(--mu)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--y)}
label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
input{width:100%;font:inherit;font-size:20px;padding:14px;border-radius:10px;border:2px solid var(--ln);background:var(--pn);color:var(--ink)}

button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--ln);background:var(--pn2);color:var(--ink);padding:14px 16px;font-weight:600}

button:disabled{opacity:.35}
.go{background:var(--y);border-color:var(--y);color:#fff;font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:.03em;width:100%;text-transform:uppercase}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.mods{display:flex;flex-direction:column;gap:8px}
.mod{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--pn);border:2px solid var(--ln);text-align:left;width:100%}
.mod .badge{background:var(--mc)}
.mod b{display:block;font-size:16px}
.mod span{font-size:13px;color:var(--mu)}
.mod .st{margin-left:auto;text-align:right;font-family:var(--disp);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.mod.done{border-color:var(--g)}

.pw{display:flex;gap:8px}
.pw button{flex:1;padding:10px;font-size:14px}

.q{font-size:22px;font-weight:700;line-height:1.3;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font-size:17px;font-weight:500;padding:14px;width:100%;transition:background .2s,border-color .2s,opacity .2s}

.timer{height:8px;border-radius:99px;background:var(--pn2);overflow:hidden}

.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.fb{padding:14px;border-radius:12px;border:2px solid var(--g);background:#E5F3E7}

.pick{display:flex;flex-direction:column;gap:8px}

.pick button.sel{border-color:var(--y)}

.rk{display:grid;grid-template-columns:70px 1fr 36px;gap:10px;align-items:center}

.rk output{font-family:var(--disp);font-weight:800;font-size:24px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--y);height:34px}
.scale{height:10px;border-radius:99px;background:linear-gradient(90deg,#1faa59,#f5c400,#e5383b)}
.big{font-family:var(--disp);font-weight:800;font-size:84px;line-height:1;color:var(--y);font-variant-numeric:tabular-nums}
.code{font-family:var(--disp);font-weight:800;font-size:46px;letter-spacing:.12em;background:var(--y);color:#fff;border-radius:12px;padding:12px;text-align:center;font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column;gap:6px}
.rows div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln);font-variant-numeric:tabular-nums}
.err{color:var(--r);font-weight:600;min-height:1.4em}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--disp);font-weight:800;font-size:64px;color:var(--g);pointer-events:none;animation:up 1s forwards;z-index:9}
.pop.bad{color:var(--r)}
@keyframes up{from{opacity:1;transform:translate(-50%,-30%)}to{opacity:0;transform:translate(-50%,-110%)}}

.msq{background:var(--pn);border:1px solid var(--ln);border-left:5px solid var(--qc);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.msq .lb{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--qc)}
.msq p{margin:0;font-weight:600;font-size:17px;line-height:1.35}
.msrow{display:flex;gap:8px}.msrow input{font-size:17px;padding:12px}.msrow button{background:var(--y);color:#fff;border-color:var(--y);font-weight:700;flex:none}
.sent{display:flex;flex-wrap:wrap;gap:6px}.sent span{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--pn2);border:1px solid var(--ln)}
.mscard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:var(--y);color:#fff;border:0;text-align:left;width:100%}
.mscard b{display:block;font-size:17px}.mscard span{font-size:13px;opacity:.85}
.link{background:none;border:0;color:var(--y);text-decoration:underline;font-weight:600;padding:6px}
.tlist{display:flex;flex-direction:column;gap:8px}
.tlist button{display:flex;align-items:center;gap:14px;text-align:left;padding:10px 12px;border:2px solid var(--ln);background:var(--pn)}
.tlist button b{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--tc);color:#fff;font-family:var(--disp);font-size:24px;flex:none}
.tlist button span{font-size:18px;font-weight:700}
.tlist button.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,#fff);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 25%,transparent)}
.msdots{display:flex;gap:6px}.msdots span{flex:1;height:6px;border-radius:99px;background:var(--ln)}.msdots span.ok{background:var(--qc)}.msdots span.cur{background:var(--qc);opacity:.45}
.msin{animation:slin .3s ease}@keyframes slin{from{opacity:0;transform:translateX(30px)}}
.msnav{display:flex;justify-content:space-between}
.msdone{text-align:center;padding:20px 0}.msdone .big{color:var(--g)}
.sync{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;border:2px solid var(--ln);background:var(--pn)}
.sync b{font-size:18px}.sync span{font-size:14px;color:var(--mu)}.sync button{align-self:flex-start;padding:8px 14px}
.sync.ok{border-color:var(--g);background:#E5F3E7}.sync.ok b{color:var(--g)}
.snd{padding:6px 8px;font-size:18px;border-radius:10px;margin-left:6px;background:var(--pn)}
.rtoast{position:fixed;left:16px;right:16px;top:16px;z-index:20;background:var(--y);color:#fff;font-weight:700;padding:14px 16px;border-radius:12px;box-shadow:0 8px 24px #14243A44;text-align:center}
.tlist button.busy{opacity:.45}.tlist button em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.mz-arm{transform-box:view-box;transform-origin:129px 56px;animation:mzWave 2.2s ease-in-out infinite}
@keyframes mzWave{0%,100%{transform:rotate(0)}15%{transform:rotate(-16deg)}30%{transform:rotate(10deg)}45%{transform:rotate(-14deg)}60%{transform:rotate(8deg)}75%,90%{transform:rotate(0)}}
.mz-guy{transform-box:view-box;transform-origin:110px 106px;animation:mzBob 2.2s ease-in-out infinite}
@keyframes mzBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.mz-shine{animation:mzShine 4.4s ease-in-out infinite 1s}
@keyframes mzShine{0%,70%{transform:skewX(-20deg) translateX(0)}90%,100%{transform:skewX(-20deg) translateX(40px)}}
.splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;background:radial-gradient(120% 80% at 50% 20%,#1F4A86 0%,#12305C 55%,#0B2142 100%);color:#fff;text-align:center;transition:opacity .5s,transform .5s}
.splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.splash .sv{width:min(86vw,420px);filter:drop-shadow(0 10px 24px #0008);animation:spIn .9s cubic-bezier(.2,1.3,.4,1) both}
.splash .sv svg{display:block;width:100%;height:auto}
.splash h1{color:#fff;font-size:38px;margin:4px 0 0;animation:spUp .7s .35s ease both}
.splash p{margin:0;color:#C9D3E3;font-size:16px;animation:spUp .7s .5s ease both}
.splash .bar{width:120px;height:5px;border-radius:99px;background:#AFB91E;animation:spGrow .8s .55s ease both}
.splash small{position:absolute;bottom:22px;color:#8EA2C2;font-size:13px;letter-spacing:.1em;text-transform:uppercase;animation:spUp .6s 1s ease both}
@keyframes spIn{from{opacity:0;transform:translateY(40px) scale(.85)}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}}
@keyframes spGrow{from{transform:scaleX(0)}}
.mzt{position:fixed;inset:0;z-index:55;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;background:#12305Cd9;opacity:0;transition:opacity .25s}
.mzt.on{opacity:1}
.mzt .card{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:12vh;transform:translateY(60vh);transition:transform .45s cubic-bezier(.2,1.2,.4,1)}
.mzt.on .card{transform:none}
.mzt .msg{background:#fff;color:#14243A;font-weight:800;font-size:20px;line-height:1.25;padding:12px 18px;border-radius:16px;border:3px solid #194682;max-width:300px;text-align:center;position:relative;box-shadow:0 8px 24px #0006}
.mzt .msg small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7C8A12;margin-bottom:2px}
.mzt .msg::after{content:"";position:absolute;left:58%;bottom:-12px;width:18px;height:18px;background:#fff;border-right:3px solid #194682;border-bottom:3px solid #194682;transform:rotate(45deg)}
.mzt .sv{width:min(70vw,300px)}.mzt .sv svg{display:block;width:100%;height:auto}
.prescard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:var(--pn);color:var(--ink);border:2px solid var(--acc);text-align:left;width:100%}
.prescard b{display:block;font-size:17px;color:var(--y)}.prescard span{font-size:13px;color:var(--mu)}
.prescard.ok{border-color:var(--g);background:#E5F3E7}.prescard.ok b{color:var(--g)}
.sigpad{width:100%;height:190px;border:2px dashed var(--y);border-radius:12px;background:#FBFCFE;touch-action:none;display:block;cursor:crosshair;-webkit-user-select:none;user-select:none}
.sigpad.has{border-style:solid}
.chk{display:flex;align-items:center;gap:10px;font-size:17px;margin:0}.chk input{width:24px;height:24px;padding:0;margin:0;box-shadow:none;flex:none;accent-color:var(--y)}
.sync.bad{border-color:var(--r);background:#FBE7E7}.sync.bad b{color:var(--r)}
.spin{width:22px;height:22px;border:3px solid var(--ln);border-top-color:var(--y);border-radius:50%;animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mz-arm,.mz-guy,.mz-shine,.splash *{animation:none!important}}

/* fotos reais nas telas de navegação */
.lid{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent);transform-origin:50% 100%;animation:lidIn .8s cubic-bezier(.2,1.2,.4,1) both,lidBob 3.2s 1s ease-in-out infinite}
@keyframes lidIn{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
@keyframes lidBob{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.6deg) translateY(-3px)}}
.splash{background:linear-gradient(180deg,#0B2142e6 0%,#12305Cd9 45%,#0B2142 88%),var(--spbg) center/cover no-repeat!important}
.splash .sv{position:relative;width:min(64vw,300px)!important;filter:none!important}

.splash .sv::after{content:"";position:absolute;left:-6%;right:-6%;bottom:-4px;height:6px;border-radius:99px;background:#AFB91E;transform:skewX(-30deg);box-shadow:0 0 18px #AFB91E88}
.mzt .sv{width:min(52vw,230px)!important;filter:drop-shadow(0 12px 24px #0008)}
.mzt .msg::after{left:50%;margin-left:-9px}
.hero{position:relative;border-radius:16px;overflow:hidden;height:168px;box-shadow:0 6px 18px #14243A22}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 30%}

.hero .ht{position:absolute;left:16px;bottom:16px;max-width:50%;text-shadow:0 1px 6px #0007;color:#fff;font-family:var(--disp);font-weight:800;font-size:19px;line-height:1.15;z-index:2}
.hero .ht small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#D7E06A;margin-bottom:4px}
.mscard{position:relative;overflow:hidden;min-height:96px;background:linear-gradient(90deg,var(--y) 0 46%,#194682d0 62%,#19468233),var(--bgi) right 30%/cover no-repeat!important}
.mscard>div{max-width:64%;position:relative;z-index:1}
.mscard>span{position:relative;z-index:1}
.mod{position:relative;overflow:hidden;min-height:76px;padding-right:104px!important}
.mod .th{position:absolute;top:0;right:0;bottom:0;width:96px;background-size:cover;background-position:50% 35%;clip-path:polygon(22% 0,100% 0,100% 100%,0 100%)}
.mod .th::before{content:"";position:absolute;top:0;bottom:0;left:0;width:22%;background:linear-gradient(to top right,transparent calc(50% - 2px),var(--mc) calc(50% - 2px),var(--mc) calc(50% + 2px),transparent calc(50% + 2px))}

@media (prefers-reduced-motion:reduce){.lid{animation:none!important}}
</style>

const MODS=[{"id": 1, "name": "Valor em SST", "c": "#194682", "risk": false, "qs": [{"t": "quiz", "q": "Qual é a diferença entre VALOR e PRIORIDADE em SST?", "o": ["São sinônimos: dá no mesmo", "Prioridade muda conforme a situação; Valor é inegociável e não muda", "Valor muda conforme a meta do mês", "Prioridade é mais forte que valor"], "c": 1, "e": "Prioridades mudam com a produção, o prazo e o custo. Quando a SST é um VALOR, ela não entra em negociação em nenhuma situação."}, {"t": "quiz", "q": "Qual destas NÃO é uma razão para buscar a Excelência em SST?", "o": ["Uma obrigação moral", "Uma exigência da sociedade", "Um bom negócio: melhora a produtividade", "Reduzir a quantidade de treinamentos"], "c": 3, "e": "As razões são: obrigação moral, exigência da sociedade, bem-estar de todos e bom negócio (produtividade, zero acidentes, acidentes catastróficos são muito caros)."}, {"t": "quiz", "q": "Segundo o modelo de influência na cultura, a cultura organizacional influencia…", "o": ["somente os indicadores do mês", "o comportamento coletivo, que influencia a atitude individual", "apenas a alta direção", "somente quem é novo na empresa"], "c": 1, "e": "Cultura → comportamento grupal → comportamento individual → atitude → valores. O líder atua em todas essas camadas."}, {"t": "quiz", "q": "A transformação cultural em SST acontece…", "o": ["Somente dentro do trabalho", "Somente fora do trabalho", "Dentro e fora do trabalho", "Somente nos dias de auditoria"], "c": 2, "e": "Quem tem a SST como valor leva esse cuidado para casa, para o trânsito, para a família: dentro e fora do trabalho."}]}, {"id": 2, "name": "Compromisso Visível e Percebido", "c": "#0A91C3", "risk": false, "qs": [{"t": "quiz", "q": "O que significa GEMBA?", "o": ["Uma ferramenta de auditoria japonesa", "O lugar real, onde as coisas acontecem", "A sala de reuniões da liderança", "O relatório mensal de SST"], "c": 1, "e": "Gemba é o chão de fábrica, o canteiro, o campo: onde os processos acontecem e os riscos aparecem."}, {"t": "quiz", "q": "Por que a liderança precisa ir ao Gemba?", "o": ["Para fiscalizar e punir", "Para substituir o relatório mensal", "Para enxergar riscos que não aparecem nos relatórios e conversar com quem opera", "Só quando acontece um acidente"], "c": 2, "e": "No Gemba o líder vê riscos reais, ouve a equipe, mostra que segurança é prioridade de verdade e age rápido para corrigir falhas e valorizar boas práticas."}, {"t": "quiz", "q": "Pela Responsabilidade de Linha, quem é o \"dono\" do risco da área?", "o": ["O técnico de segurança", "O SESMT", "A liderança da área (linha gerencial)", "O colaborador mais novo"], "c": 2, "e": "A linha gerencial responde pela gestão de SST e pelos resultados. A liderança é dona do negócio e dona do risco."}, {"t": "quiz", "q": "Complete a orientação: \"Em situações de risco…\"", "o": ["…termine a tarefa rápido", "…avalie, pare o equipamento e chame seu líder!", "…registre no fim do turno", "…peça para outro colega fazer"], "c": 1, "e": "Parar diante do risco é uma atitude visível de compromisso, e o líder precisa apoiá-la sempre."}, {"t": "quiz", "q": "Qual afirmação faz parte da Responsabilidade de Linha?", "o": ["Alguns acidentes são inevitáveis", "Sempre existe uma forma segura de executar qualquer tarefa, e todo acidente pode ser evitado", "Segurança é responsabilidade exclusiva do SESMT", "O coordenador responde só pela própria segurança"], "c": 1, "e": "Gerente: responsável por todas as pessoas da unidade. Coordenador: por si e pela equipe. Cada pessoa: por si e pelos colegas."}]}, {"id": 3, "name": "Governança em SST", "c": "#6E7A12", "risk": false, "qs": [{"t": "quiz", "q": "No Comitê SST de GERÊNCIA, quem lidera e quem são os membros?", "o": ["Líder: Superintendente | Membros: Gerentes e SST", "Líder: Gerentes | Membros: Coordenadores e SST", "Líder: Coordenadores | Membros: Supervisores e SST", "Líder: SESMT | Membros: CIPA"], "c": 1, "e": "Superintendência → Gerentes e SST · Gerência → Coordenadores e SST · Coordenação → Supervisores e SST."}, {"t": "quiz", "q": "No Comitê SST de COORDENAÇÃO, quem são os membros?", "o": ["Gerentes e SST", "Supervisores e SST", "Somente o SESMT", "Diretoria"], "c": 1, "e": "O Comitê de Coordenação é liderado pelos Coordenadores, e os membros são os Supervisores e o SST."}, {"t": "quiz", "q": "O processo de mudança de cultura em SST deve buscar…", "o": ["o efeito, para agir mais rápido", "a causa, e não o efeito", "o culpado pelo desvio", "apenas a meta do indicador"], "c": 1, "e": "A Governança busca a causa raiz. Tratar só o efeito faz o problema voltar."}, {"t": "quiz", "q": "Segundo o propósito da Governança, qual deve ser a principal estratégia para atingir a Excelência em SST?", "o": ["Aumento de fiscalização", "Disciplina Operacional", "Campanhas pontuais", "Premiação por dias sem acidente"], "c": 1, "e": "A Disciplina Operacional é a principal estratégia, com ações simples, consistentes e sistematizadas."}, {"t": "quiz", "q": "Qual destes é um PRODUTO esperado da Governança em SST?", "o": ["Reuniões sem pauta", "Todos os acidentes, incidentes e desvios críticos investigados e divulgados", "Metas genéricas e sem medição", "Recursos só depois de um acidente"], "c": 1, "e": "Outros produtos: objetivos claros e mensuráveis, recursos direcionados, avaliação contínua, conformidade legal e responsáveis indicados de imediato."}]}, {"id": 4, "name": "Percepção de Risco", "c": "#D9622B", "risk": true, "qs": [{"t": "order", "q": "Coloque em ordem o PROCESSO DA PERCEPÇÃO DE RISCOS", "items": ["Estímulo", "Percepção", "Avaliação", "Ação"]}, {"t": "quiz", "q": "O que é Percepção de Risco?", "o": ["Medo de se acidentar", "Capacidade de reagir adequadamente (reconhecer, interpretar, agir) a um estímulo com potencial de causar danos", "Conhecer todas as normas de cor", "Saber preencher a APR"], "c": 1, "e": "A percepção envolve três passos, reconhecer, interpretar e agir, e vale dentro e fora do trabalho."}]}, {"id": 5, "name": "POC – Observação Comportamental", "c": "#695FAA", "risk": false, "qs": [{"t": "quiz", "q": "O que significa a sigla POC?", "o": ["Procedimento Operacional Controlado", "Programa de Observação Comportamental", "Plano de Ocorrências Críticas", "Ponto de Controle"], "c": 1, "e": "POC é a ferramenta da liderança para administrar os desvios comportamentais."}, {"t": "quiz", "q": "Qual é o objetivo do POC da liderança?", "o": ["Bater a meta de observações do mês", "Observar as pessoas enquanto trabalham, reforçar práticas seguras e corrigir e prevenir comportamentos inseguros", "Encontrar culpados", "Substituir o DDS"], "c": 1, "e": "O objetivo é ter uma liderança capacitada para eliminar os acidentes da sua área de responsabilidade."}, {"t": "quiz", "q": "Na Pirâmide de Probabilidades, ao bloquear desvios comportamentais na base…", "o": ["nada muda no topo", "reduzimos a probabilidade de acidentes e fatalidades no topo", "aumentamos os acidentes", "só melhoramos o indicador"], "c": 1, "e": "Cada desvio bloqueado na base reduz a chance de um acidente grave ou de uma fatalidade no topo."}, {"t": "quiz", "q": "O que define um RAP (Risco de Alto Potencial)?", "o": ["A frequência com que acontece", "A gravidade do que pode acontecer, mesmo que nunca tenha ocorrido", "Já ter acontecido um acidente na área", "A quantidade de pessoas na área"], "c": 1, "e": "RAP não é definido pela frequência, e sim pela gravidade: pode estar presente mesmo sem histórico de acidentes."}, {"t": "order", "q": "PASSO A PASSO DA ABORDAGEM: coloque na ordem certa", "items": ["Observe o comportamento", "Aborde com respeito", "Alerte sobre o risco", "Sugira a correção", "Bloqueie o desvio", "Reforce o cuidado"]}]}, {"id": 6, "name": "Disciplina Operacional", "c": "#C2185B", "risk": false, "qs": [{"t": "quiz", "q": "Qual destes NÃO é exemplo de DISCIPLINA VISÍVEL?", "o": ["Uso correto e contínuo das ferramentas do programa PAZ", "Acompanhamento do IRS", "Investigações de acidentes com qualidade e dentro do prazo", "Fazer todos os POCs no último dia do mês só para bater a meta"], "c": 3, "e": "Disciplina visível também inclui controle dos treinamentos legais, programa Dono de Área, disciplina no POC e correção autônoma de condições de risco."}, {"t": "quiz", "q": "Qual é o MELHOR modelo de procedimento?", "o": ["Procedimento operacional com um item de SST (só EPIs e bloqueio)", "Procedimento operacional e, separado, um procedimento de SST", "Procedimento com a SST integrada em cada etapa do processo ou tarefa", "Sem procedimento, confiando na experiência"], "c": 2, "e": "Quando a SST está integrada a cada etapa, ela passa a fazer parte do jeito certo de trabalhar, em vez de ser um item à parte."}, {"t": "quiz", "q": "\"Controle dos treinamentos legais e obrigatórios\" e \"Implementação do programa Dono de Área\" fazem parte de…", "o": ["Percepção de Risco", "Disciplina Operacional (Disciplina Visível)", "Melhoria Contínua", "Valor em SST"], "c": 1, "e": "São itens de Disciplina Visível, que tornam a SST parte da rotina."}]}, {"id": 7, "name": "Melhoria Contínua", "c": "#1F8A70", "risk": false, "qs": [{"t": "order", "q": "O QUE O PIT STOP NOS ENSINA: coloque na ordem como a equipe chega a 1,88 s", "items": ["Mesmo objetivo para todos: tempo cada vez menor", "Cada pessoa sabe exatamente sua função e sua sequência", "Padronização de cada movimento e treino repetido", "Comunicação clara: luzes e sinais definem o momento certo", "Pequenas melhorias somadas ao longo dos anos"]}, {"t": "quiz", "q": "Complete: \"Nenhum trabalho é tão urgente e importante que…\"", "o": ["…não possa ser feito depois", "…não possa ser realizado com planejamento", "…não precise de EPI", "…exija análise de risco"], "c": 1, "e": "Pressa é inimiga da segurança. Planejar é o que permite fazer rápido e com segurança, como no pit stop."}, {"t": "quiz", "q": "O que o pit stop da F1 ensina sobre Melhoria Contínua?", "o": ["Que velocidade vem de improviso", "Que padronização, planejamento, treino e trabalho em equipe reduzem tempo e erros", "Que só o piloto importa", "Que não vale a pena mudar o processo"], "c": 1, "e": "O pit stop evoluiu de segundos para frações de segundo com processo, treino e melhoria constante. A SST pode evoluir do mesmo jeito."}]}];

function render(){
  stopT();
  const v=S.view;
  if(v==="join")return vJoin();
  if(v==="home")return vHome();
  if(v==="senha")return vSenha();
  if(v==="play")return vPlay();
  if(v==="end")return vEnd();
  if(v==="ms")return vMs();
  if(v==="presenca")return vPres();
}
function vMs(){
  const back=S.team?"home":"join";
  if(!S.room){
    $("app").innerHTML=(S.team?head():`<div class="brand">${BRAND}</div><div class="stripe"></div>`)+`<div><div class="eyebrow">Momento de Segurança</div><h2>Entre na sala da conversa</h2></div>
    <div><label for="rm">Código da sala (aparece no telão)</label><input id="rm" maxlength="8" autocapitalize="characters" autocomplete="off" placeholder="Ex.: K7Q2PA"></div><div class="err" id="er"></div>
    <button class="go" data-a="room">Entrar na sala</button><button data-a="msback" data-b="${back}">Voltar</button>`;return}
  S.sent=S.sent||{};const mine=S.sent[S.room]||{};
  S.msi=S.msi||{};let i=S.msi[S.room]||0;
  const top=(S.team?head():`<div class="brand">${BRAND}</div><div class="stripe"></div>`)+`<div><div class="eyebrow">Momento de Segurança · sala ${esc(S.room)}</div></div>
  <div class="msdots">${MSQ.map((q,k)=>`<span class="${k<i?"ok":k===i?"cur":""}" style="--qc:${q[2]}"></span>`).join("")}</div>`;
  if(i>=MSQ.length){
    const n=Object.values(mine).reduce((s,a)=>s+a.length,0);
    $("app").innerHTML=top+`<div class="msdone"><div class="big" style="font-size:64px">✓</div><h2>Respostas enviadas!</h2><p class="mu">Você enviou ${n} insight${n===1?"":"s"}. Acompanhe o mapa mental no telão.</p></div>
    <button class="go" data-a="msback" data-b="${back}">Voltar</button><button data-a="msgo" data-i="0">Responder de novo</button>`;return}
  const q=MSQ[i];
  $("app").innerHTML=top+`<div class="msq msin" style="--qc:${q[2]}"><div class="lb">Pergunta ${i+1} de ${MSQ.length} · ${q[0]}</div><p>${q[1]}</p>
   <div class="msrow"><input id="ms${i}" maxlength="40" autocomplete="off" placeholder="Uma palavra ou frase curta"><button data-a="mssend" data-q="${i}">Enviar</button></div>
   <div class="err" id="me${i}" style="min-height:0"></div>
   ${(mine[i]||[]).length?`<div class="sent">${mine[i].map(w=>`<span>✓ ${esc(w)}</span>`).join("")}</div>`:""}</div>
  <div class="msnav">${i>0?`<button class="link" data-a="msgo" data-i="${i-1}">‹ Pergunta anterior</button>`:"<span></span>"}<button class="link" data-a="msgo" data-i="${i+1}">${(mine[i]||[]).length?"Próxima ›":"Pular ›"}</button></div>
  <button data-a="msback" data-b="${back}">Sair</button>`;
  setTimeout(()=>{const n=$("ms"+i);n&&n.focus()},60);
}
async function msSend(i){
  const inp=$("ms"+i),w=(inp.value||"").trim().replace(/\s+/g," ");if(!w)return;
  const btn=document.querySelector(`[data-a=mssend][data-q="${i}"]`);btn.disabled=true;$("me"+i).textContent="";
  try{const r=await fetch(RELAY+"missaozero-frisia-"+S.room.toLowerCase(),{method:"POST",body:JSON.stringify({q:i,w:w.slice(0,40),t:S.team||0})});
    if(!r.ok)throw new Error(r.status);
    S.sent=S.sent||{};S.sent[S.room]=S.sent[S.room]||{};(S.sent[S.room][i]=S.sent[S.room][i]||[]).push(w);S.msi=S.msi||{};S.msi[S.room]=i+1;save();pop("✓",false);vMs()}
  catch(e){btn.disabled=false;$("me"+i).textContent=e.message==="429"?"Muitos envios ao mesmo tempo. Aguarde alguns segundos e envie de novo.":"Não foi possível enviar. Confira a internet e tente de novo."}

function cur(){return S.mods[E.m]}
function vPlay(){
  stopT();
  const m=modById(E.m),st=cur();
  const n=m.qs.length+(m.risk?1:0);
  if(st.i>=m.qs.length){ if(m.risk)return vRisk(m,st); return finish(); }
  const q=m.qs[st.i];
  const ans=st.a[st.i];
  let body="";
  if(q.t==="quiz"){
    body=`<div class="q">${q.q}</div><div class="opts">${q.o.map((o,k)=>{let c="";if(ans){c=k===q.c?"ok":(k===ans.k?"bad":"off")}else if((E.elim||[]).includes(k))c="gone";return`<button class="opt ${c}" data-o="${k}" ${ans||c==="gone"?"disabled":""}><i>${"ABCD"[k]}</i><span>${o}</span></button>`}).join("")}</div>`;
  }else{
    E.ord=E.ord||[];
    const shown=st.sh[st.i];
    body=`<div class="q">${q.q}</div><p class="mu" style="margin:0">Toque nas etapas na ordem correta.</p><div class="pick">${shown.map(ix=>{const pos=ans?ans.seq.indexOf(ix):E.ord.indexOf(ix);let c=pos>=0?"sel":"";if(ans)c=pos===ix?"ok sel":"bad sel";return`<button class="${c}" data-p="${ix}" ${ans?"disabled":""}><em>${pos>=0?pos+1:"·"}</em>${q.items[ix]}</button>`}).join("")}</div>
    ${ans?"":`<div class="pw"><button data-a="undo" ${E.ord.length?"":"disabled"}>Desfazer</button><button class="go" style="flex:2;font-size:18px" data-a="sendord" ${E.ord.length===q.items.length?"":"disabled"}>Confirmar ordem</button></div>`}`;
  }
  let fb="";

function sigPad(cv){const ctx=cv.getContext("2d");let cur=null;
  const fit=()=>{const r=cv.getBoundingClientRect(),d=Math.max(1,window.devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()};

  const pos=e=>{const r=cv.getBoundingClientRect();return[Math.round((e.clientX-r.left)*10)/10,Math.round((e.clientY-r.top)*10)/10]};
  cv.addEventListener("pointerdown",e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}cur=[pos(e)];PSIG.push(cur);draw()});
  cv.addEventListener("pointermove",e=>{if(!cur)return;e.preventDefault();const ev=e.getCoalescedEvents?e.getCoalescedEvents():[e];(ev.length?ev:[e]).forEach(x=>cur.push(pos(x)));draw()});
  const end=()=>{cur=null};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  cv.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});cv.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});

  catch(e){b.disabled=false;b.textContent="Entrar na lista";er.textContent="Não foi possível validar o código. Tente de novo."}}
function rdp(p,eps){if(p.length<3)return p.slice();const a=p[0],b=p[p.length-1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);let dm=-1,ix=0;
  for(let i=1;i<p.length-1;i++){const d=L<1e-6?Math.hypot(p[i][0]-a[0],p[i][1]-a[1]):Math.abs(dy*p[i][0]-dx*p[i][1]+b[0]*a[1]-b[1]*a[0])/L;if(d>dm){dm=d;ix=i}}
  if(dm>eps){const l=rdp(p.slice(0,ix+1),eps),r=rdp(p.slice(ix),eps);return l.slice(0,-1).concat(r)}return[a,b]}
/* traços vetoriais: grade 300×100, Ramer–Douglas–Peucker, delta-encoding ("x,y,dx,dy,…;…") */
function sigEncode(strokes,eps){const all=strokes.flat();if(!all.length)return"";let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;all.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)});
  const bw=Math.max(1,x1-x0),bh=Math.max(1,y1-y0),sc=Math.min(294/bw,94/bh,3),ox=(300-bw*sc)/2,oy=(100-bh*sc)/2;
  return strokes.map(st=>{const q=[];rdp(st.map(([x,y])=>[(x-x0)*sc+ox,(y-y0)*sc+oy]),eps).forEach(([x,y])=>{const P=[Math.round(x),Math.round(y)],l=q[q.length-1];if(!l||l[0]!==P[0]||l[1]!==P[1])q.push(P)});
    const o=[q[0][0],q[0][1]];for(let i=1;i<q.length;i++)o.push(q[i][0]-q[i-1][0],q[i][1]-q[i-1][1]);return o.join(",")}).join(";")}
async function presEncrypt(obj,key){const k=await crypto.subtle.importKey("raw",ub64(key),{name:"AES-GCM"},false,["encrypt"]);const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(obj))));const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);return b64u(all)}
const PCH=3300;/* cada mensagem fica abaixo de 3,5 KB */
async function presSubmit(){const er=$("pf-er"),f=E.pf;er.textContent="";
  f.terc=$("pf-terc").checked;f.mat=($("pf-mat").value||"").replace(/\D/g,"");f.emp=($("pf-emp").value||"").trim().replace(/\s+/g," ");f.nome=($("pf-nome").value||"").trim().replace(/\s+/g," ");f.setor=($("pf-setor").value||"").trim().replace(/\s+/g," ");
  if(!f.terc&&!f.mat){er.textContent="Informe a matrícula (somente números) ou marque “Sou terceiro”.";return}
  if(f.terc&&!f.emp){er.textContent="Informe o nome da empresa.";return}
  if(f.nome.length<3){er.textContent="Informe o nome completo.";return}
  if(PSIG.reduce((n,s)=>n+s.length,0)<8){er.textContent="A assinatura é obrigatória.";return}
  if(!window.crypto||!crypto.subtle){er.textContent="Este navegador não permite o envio seguro. Atualize o navegador ou use outro celular.";return}
  let sig="";for(const eps of [.7,1.2,2,3]){sig=sigEncode(PSIG,eps);if(sig.length<=6000)break}
  const id=b64u(crypto.getRandomValues(new Uint8Array(9)));
  const btn=document.querySelector("[data-a=presok]");if(btn){btn.disabled=true;btn.textContent="Enviando…"}
  try{const d=await presEncrypt({v:1,id,terc:f.terc,mat:f.terc?"":f.mat,emp:f.terc?f.emp:"",nome:f.nome,setor:f.setor,sig,t:Date.now()},S.pk);
    const parts=[];for(let i=0;i<d.length;i+=PCH)parts.push(d.slice(i,i+PCH));
    S.pres={id,key:S.pk,room:S.room,nome:f.nome,parts,st:"sending"};save();E.pf=null;PSIG=[];presSend()}
  catch(e){if(btn){btn.disabled=false;btn.textContent="Confirmar presença"}er.textContent="Não foi possível preparar o envio. Tente de novo."}}
async function presSend(){const P=S.pres;if(!P||!P.parts||P.st==="ok")return;P.st="sending";PLATE=false;save();if(S.view==="presenca")vPres();
  let ok=true;for(let i=0;i<P.parts.length&&ok;i++){ok=await pub({k:"pres",id:P.id,i,n:P.parts.length,d:P.parts[i]})}
  if(S.pres!==P||P.st==="ok")return;P.st=ok?"sent":"fail";save();if(S.view==="presenca")vPres();else if(S.view==="home"||S.view==="join")render()}
function presOk(){const P=S.pres;P.st="ok";P.parts=null;save();clearTimeout(PTO);PLATE=false;
  if(S.view==="presenca"){S.view=S.presBack&&S.presBack!=="presenca"?S.presBack:(S.team?"home":"join");save();render();sOk();mzTrans("Presença registrada","Obrigado, "+esc(P.nome.split(" ")[0])+"!",1800)}
  else if(S.view==="home"||S.view==="join")render()}
addEventListener("online",()=>{if(presPending()&&S.pres.st!=="sent")presSend()});
let RES=null,CL={},REPLAY=true,kickMsg="";
if(!S.dev){S.dev=Math.random().toString(36).slice(2,10);save()}
function takenBy(t){return CL[t]&&CL[t]!==S.dev}
function pub(o){if(!S.room)return Promise.resolve(false);return fetch(RELAY+"missaozero-frisia-"+S.room.toLowerCase(),{method:"POST",body:JSON.stringify(o)}).then(r=>r.ok).catch(()=>false)}
function kick(msg){S.team=null;S.view="join";save();stopT();E={};kickMsg=msg||"Essa equipe já foi escolhida em outro celular. Escolha outra equipe.";render()}
function applyReset(ts){S.resetAt=ts;S.mods={};S.pw={dobro:true,lider:true};save();stopT();E={};
  if(S.team&&S.view!=="ms"&&S.view!=="join")S.view="home";render();
  const d=document.createElement("div");d.className="rtoast";d.textContent="O facilitador zerou o placar. Vamos começar de novo!";document.body.appendChild(d);setTimeout(()=>d.remove(),4000);try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}}
function listen(){if(!S.room||typeof EventSource==="undefined")return;try{RES&&RES.close()}catch(e){}
  if(!S.joinedAt){S.joinedAt=Date.now();save()}
  try{RES=new EventSource(RELAY+"missaozero-frisia-"+S.room.toLowerCase()+"/sse?since=all");
    RES.onopen=()=>{setTimeout(()=>{REPLAY=false;if(S.team&&!CL[S.team])pub({k:"claim",t:S.team,d:S.dev})},1500)};
    RES.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event!=="message")return;const x=JSON.parse(m.message);
      if(x.k==="claim"){const t=+x.t;if(!CL[t])CL[t]=x.d;if(S.team===t&&CL[t]!==S.dev)kick();else if(S.view==="join")vJoin();return}if(x.k==="release"){const t=+x.t;if(CL[t]&&(x.d===CL[t]||x.d==="telao"))delete CL[t];if(S.team===t&&x.d==="telao"&&!REPLAY)kick("O facilitador liberou sua equipe. Escolha novamente.");if(S.view==="join")vJoin();return}if(x.k==="pres_ok"){if(S.pres&&x.id===S.pres.id&&S.pres.st!=="ok")presOk();return}if(x.k==="reset"){const ts=m.time*1000+999;if(ts>Math.max(S.resetAt||0,S.joinedAt||0))applyReset(ts)}}catch(err){}}}catch(e){}}
listen();
syncScores();
if(presPending()&&S.pres.st!=="sent")presSend();else if(presPending()){S.pres.st="sent";save()}
splash();
render();
</script>
